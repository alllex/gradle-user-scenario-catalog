# See adjust-test-task.md
name = "adjust-test-task"
description = "A test needs a setting the test task does not pass it. Adjust the test task in that build script and run the tests."

[[steps]]
name = "the test fails without the setting"
run.gradle = { args = ":lib2:test --tests 'lib2.ShoutTest'", expect = "fail" }

[[steps]]
name = "pass the setting to the test task"

  [[steps.edit]]
  file = "lib2/build.gradle.kts"
  replace = 'dependencies { implementation(project(":lib1")) }'
  with = '''dependencies { implementation(project(":lib1")) }
tasks.test { systemProperty("shout.locale", "en") }'''

[[steps]]
name = "run the tests again"
run.gradle = ":lib2:test --tests 'lib2.ShoutTest'"

[setup]
layout.base = "../templates/java-application.toml"

[setup.layout.project]
# overwrites lib2's test class with one whose tests read a system property the
# test task does not set yet, so they fail until the edit above lands
"lib2/src/test/java/lib2/ShoutTest.java" = '''
package lib2;
import org.junit.jupiter.api.Test;
import static org.junit.jupiter.api.Assertions.assertEquals;
class ShoutTest {
    private static String locale() {
        return System.getProperty("shout.locale", "unset");
    }

    @Test void shoutsAGreeting() {
        assertEquals("en", locale());
        assertEquals("HELLO, WORLD!", Shout.shout("world"));
    }

    @Test void shoutsACapitalName() {
        assertEquals("en", locale());
        assertEquals("HELLO, ADA!", Shout.shout("Ada"));
    }
}
'''
