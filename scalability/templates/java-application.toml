# Template project for the scenarios.
#
# A Java application at the root with three library subprojects: lib2 depends on lib1,
# and the application depends on both. Shared test and quality configuration comes from
# a java-conventions plugin in the build-logic included build. Dependencies come from
# Maven Central through a version catalog.
#
# Checkstyle runs in every project that applies the conventions, against one rule: no
# line over 100 columns. A sanityCheck task collects the Checkstyle tasks without
# depending on test, so code quality can be checked without running any tests.
#
# Shaped so that a scenario has something to change:
#   - lib1 carries a test class with three methods, so narrowing from the class to
#     one method is a real narrowing.
#   - Greeting.hello is exercised by all three of them, so an edit to the main
#     source moves every test at once.
#   - lib2 does not depend on the version catalog's library, so a scenario can add it.
#   - lib3 has not adopted java-conventions, so a scenario can apply it. Its test
#     needs JUnit, which arrives only with the conventions.
#   - lib1 has a checkResources task of its own, which no other project has and
#     whose work is confined to lib1.
#
# The configuration cache is left unset.

[project]
"settings.gradle.kts" = '''
pluginManagement { includeBuild("build-logic") }
dependencyResolutionManagement { repositories { mavenCentral() } }
rootProject.name = "java-application"
include("lib1", "lib2", "lib3")
'''

"config/checkstyle/checkstyle.xml" = '''
<?xml version="1.0"?>
<!DOCTYPE module PUBLIC "-//Checkstyle//DTD Checkstyle Configuration 1.3//EN"
  "https://checkstyle.org/dtds/configuration_1_3.dtd">
<module name="Checker">
  <module name="LineLength">
    <property name="max" value="100"/>
  </module>
</module>
'''

"gradle/libs.versions.toml" = '''
[versions]
commons-lang3 = "3.17.0"

[libraries]
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
'''

"build.gradle.kts" = '''
plugins { id("java-conventions"); application }
application { mainClass = "app.App" }
dependencies { implementation(project(":lib1")); implementation(project(":lib2")) }
'''

"lib1/build.gradle.kts" = '''
plugins { id("java-conventions") }
dependencies { implementation(libs.commons.lang3) }
// A task of lib1's own: it reads files that live in lib1 and produces nothing
// any other project consumes.
tasks.register("checkResources") {
    val messages = layout.projectDirectory.file("src/main/resources/messages.properties")
    inputs.file(messages)
    doLast {
        require(messages.asFile.readText().contains("greeting=")) {
            "messages.properties has no greeting"
        }
        println("resources ok")
    }
}
'''

"lib2/build.gradle.kts" = '''
plugins { id("java-conventions") }
dependencies { implementation(project(":lib1")) }
'''

# lib3 has not adopted the shared conventions: plain java, so no JUnit and no
# Checkstyle. Scenarios that apply java-conventions to a project start here.
"lib3/build.gradle.kts" = '''
plugins { java }
'''

"build-logic/settings.gradle.kts" = '''
dependencyResolutionManagement { repositories { gradlePluginPortal() } }
rootProject.name = "build-logic"
'''

"build-logic/build.gradle.kts" = '''
plugins { `kotlin-dsl` }
'''

"build-logic/src/main/kotlin/java-conventions.gradle.kts" = '''
plugins { java; checkstyle }
dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}
tasks.test {
    useJUnitPlatform()
    filter { isFailOnNoMatchingTests = false }   // so `test --tests X` can target one project's tests
}
// Code quality across the build, without running any tests.
tasks.register("sanityCheck") {
    group = "verification"
    dependsOn(tasks.withType<Checkstyle>())
}
'''

"src/main/java/app/App.java" = '''
package app;
import lib2.Shout;
public class App {
    public static void main(String[] args) { System.out.println(Shout.shout("world")); }
}
'''

"src/test/java/app/AppTest.java" = '''
package app;
import lib2.Shout;
import org.junit.jupiter.api.Test;
import static org.junit.jupiter.api.Assertions.assertEquals;
class AppTest {
    @Test void shouts() { assertEquals("HELLO, WORLD!", Shout.shout("world")); }
}
'''

"lib1/src/main/java/lib1/Greeting.java" = '''
package lib1;
import org.apache.commons.lang3.StringUtils;
public class Greeting {
    public static String hello(String name) {
        return "Hello, " + StringUtils.capitalize(name) + "!";
    }
}
'''

"lib1/src/main/resources/messages.properties" = '''
greeting=Hello
'''

"lib1/src/test/java/lib1/GreetingTest.java" = '''
package lib1;
import org.junit.jupiter.api.Test;
import static org.junit.jupiter.api.Assertions.assertEquals;
class GreetingTest {
    @Test void capitalizes() { assertEquals("Hello, World!", Greeting.hello("world")); }
    @Test void keepsAnAlreadyCapitalName() { assertEquals("Hello, Ada!", Greeting.hello("Ada")); }
    @Test void greetsAnEmptyName() { assertEquals("Hello, !", Greeting.hello("")); }
}
'''

"lib3/src/main/java/lib3/Counter.java" = '''
package lib3;
public class Counter {
    public static int words(String text) {
        return text.isBlank() ? 0 : text.trim().split("\\s+").length;
    }
}
'''

# lib3's test needs JUnit, which only the conventions plugin provides.
"lib3/src/test/java/lib3/CounterTest.java" = '''
package lib3;
import org.junit.jupiter.api.Test;
import static org.junit.jupiter.api.Assertions.assertEquals;
class CounterTest {
    @Test void countsWords() { assertEquals(2, Counter.words("hello world")); }
    @Test void countsNothingInBlankText() { assertEquals(0, Counter.words("   ")); }
}
'''

"lib2/src/main/java/lib2/Shout.java" = '''
package lib2;
import lib1.Greeting;
public class Shout {
    public static String shout(String name) { return Greeting.hello(name).toUpperCase(); }
}
'''
